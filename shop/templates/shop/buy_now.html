{% extends 'base.html' %}
{% block title %}Buy Now - {{ product.name }}{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row">
        <!-- Product Details -->
        <div class="col-md-6 mb-4">
            <div class="card">
                <div class="d-flex mb-3">
                    <span class="badge bg-danger me-2">Category: {{ product.category.name }}</span>
                    <span class="badge bg-primary">In Stock: {{ product.stock }}</span>
                </div>
                <img src="{{ product.image.url }}" class="card-img-top img-fluid" alt="{{ product.name }}" style="max-height: 300px; object-fit: contain;">
                <div class="card-body">
                    <h2 class="card-title mb-3">{{ product.name }}</h2>
                    <p class="text-muted mb-3">{{ product.description }}</p>
                    <h3 class="text-success mb-4">₹{{ product.price }}</h3>
                </div>
            </div>
        </div>

         <!-- Order Form -->
        <div class="col-md-6">
            <form method="POST" action="/place_order/">
                {% csrf_token %}
                <h3 class="mb-4">Customer Information</h3>
                <input type="hidden" name="product" value="{{ product.id }}">

                <!-- Assuming user is logged in and user object is available in the context -->
                <div class="mb-3">
                    <label for="full_name" class="form-label">Full Name</label>
                    <input type="text" id="full_name" name="full_name" class="form-control" value="{{ user.username }}" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" id="email" name="email" class="form-control" value="{{ user.email }}" required>
                </div>
                <div class="mb-3">
                    <label for="address" class="form-label">Shipping Address</label>
                    <textarea id="address" name="address" class="form-control" rows="3" placeholder="Enter your shipping address here" required></textarea>
                </div>
                <div class="mb-3">
                    <label for="payment_method" class="form-label">Payment Method</label>
                    <select id="payment_method" name="payment_method" class="form-select" required>
                        <option value="" disabled selected>Select Payment Method</option>
                        <option value="credit_card">Credit Card</option>
                        <option value="paypal">PayPal</option>
                        <option value="bank_transfer">Bank Transfer</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-success btn-lg w-100">Place Order</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
